version: "3.9"

name: smart-learning-companion

networks:
  smart-learning-net:
    name: smart-learning-net
    driver: bridge

volumes:
  ollama:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    networks:
      - smart-learning-net

  backend:
    container_name: backend
    build:
      context: ./smart-learning-companion-4309/backend-api
      dockerfile: Dockerfile
    env_file:
      - ./smart-learning-companion-4309/backend-api/.env
    environment:
      PORT: "${PORT:-8080}"
      AI_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3:instruct"
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - smart-learning-net

  frontend:
    container_name: frontend
    build:
      context: ./smart-learning-companion-4309/micro_learning_ai_tutor_frontend
      dockerfile: Dockerfile
      args:
        # Inject the compose-network URL at build time for Flutter web
        BACKEND_BASE_URL: "http://backend:8080"
    environment:
      # Also set at runtime in case app reads from environment in future
      BACKEND_BASE_URL: "http://backend:8080"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - smart-learning-net
